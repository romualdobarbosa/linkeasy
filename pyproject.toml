[project]
name = "linkeasy"
version = "0.1.0"
description = "AI-orchestrated content pipeline for LinkedIn: drafting, visual rendering and scheduled publishing"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "python-dotenv>=1.1",
    "requests>=2.32.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "responses>=0.26",
    "ruff>=0.17",
]

[tool.uv]
# Scripts soltos na raiz (auth.py, post.py), não um pacote instalável.
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
