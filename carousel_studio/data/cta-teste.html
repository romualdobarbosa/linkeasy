<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  @page { size: 1080px 1080px; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Barlow', sans-serif; }

  .slide {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    position: relative;
    break-after: page;
  }
  .slide:last-child { break-after: auto; }
</style>
</head>
<body>

<div class="slide" style="background:#0A122A;">

  <!-- conteudo principal centralizado -->
  <div style="
    position: absolute;
    top: 80px; left: 80px;
    width: 880px;
    height: 780px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  ">
    <div style="width: 64px; height: 5px; background: #FFD166; margin-bottom: 32px;"></div>
    <p style="color:#FFF7E6; font-size:44px; font-weight:700; line-height:1.45; margin-bottom:40px; max-width:780px;">
      Agora que voce conhece a ordem real, da para depurar erros de query com muito mais precisao.
    </p>
    <p style="color:#FFD166; font-size:36px; font-weight:700; line-height:1.5; margin-bottom:16px;">
      Salva este slide para consultar quando precisar.
    </p>
    <p style="color:#FFF7E6; font-size:32px; opacity:0.6; line-height:1.5;">
      Me segue para mais conteudo sobre dados e SQL.
    </p>
  </div>

  <!-- assinatura: foto circular + nome -->
  <div style="
    position: absolute;
    bottom: 72px; left: 80px;
    display: flex;
    align-items: center;
    gap: 28px;
  ">
    <!-- moldura circular -->
    <div style="
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #FFD166;
      overflow: hidden;
      flex-shrink: 0;
    ">
      <img src="../../data/Photos/perfil.jpg"
           style="width:100%; height:100%; object-fit:cover; object-position:top center;" />
    </div>
    <!-- nome -->
    <div>
      <p style="color:#FFF7E6; font-size:36px; font-weight:700; line-height:1.2;">Romualdo Barbosa</p>
      <p style="color:#FFF7E6; font-size:28px; opacity:0.5; margin-top:6px;">Dados e Tecnologia</p>
    </div>
  </div>

</div>

</body>
</html>
